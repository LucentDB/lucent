# Tag-triggered release build.
#
#   node scripts/bump-version.mjs 0.1.0
#   git commit -am "release: v0.1.0" && git tag v0.1.0 && git push --follow-tags
#
# Produces ONE DRAFT release. Publishing is manual and deliberate: the updater
# endpoint (releases/latest/download/latest.json) resolves only to published
# releases, so a bad build cannot reach an existing install's auto-updater
# until a human says so. Publishing is also what updates the install channels
# (tap.yml, and the Windows/Linux channels once they exist).
#
# Required secrets:
#   TAURI_SIGNING_PRIVATE_KEY           minisign key for updater artifacts
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
#
# There is deliberately NO Apple certificate: macOS is ad-hoc signed
# (bundle.macOS.signingIdentity = "-") and never notarized, so the old
# `security import` step could only ever fail. See the spec
# docs/superpowers/specs/2026-08-29-release-distribution-design.md.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev xdg-utils

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The action installs the target into `stable` and selects it with
      # `rustup default` — the weakest override rustup has. rust-toolchain.toml
      # outranks it, so every cargo call below actually runs under the pinned
      # toolchain, which would NOT have this target's std and would fail with
      # "can't find crate for `std`". Install it into whichever toolchain the
      # pin selects. No-op when they are the same.
      - name: Add the target to the pinned toolchain
        run: rustup target add ${{ matrix.target }}

      # aws-lc-sys reaches the graph via russh and rustls and cannot assemble
      # its crypto primitives under MSVC without NASM.
      - name: Install NASM
        if: matrix.platform == 'windows-latest'
        uses: ilammy/setup-nasm@v1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Version consistency
        run: node scripts/check-version.mjs

      # The sidecars (postgres driver, duckdb driver, ACP bridge) are built and
      # staged for THIS target by `beforeBuildCommand` — see
      # scripts/stage-sidecars.mjs. Nothing to stage here: it runs inside
      # `tauri build`, after `npm ci` and the `rustup target add` above.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Lucent ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
