[package]
name = "lucent-driver-postgres"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lucent-driver-postgres"
path = "src/main.rs"

[lib]
name = "lucent_driver_postgres"
path = "src/lib.rs"

[dependencies]
lucent-protocol = { path = "../lucent-protocol" }
lucent-worker-host = { path = "../lucent-worker-host" }
tokio = { workspace = true }
async-trait = { workspace = true }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
rust_decimal = { version = "1", features = ["db-tokio-postgres"] }
futures = { workspace = true }
uuid = { workspace = true }
chrono = "0.4"
serde_json = "1"

[dev-dependencies]
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
tempfile = "3"
uuid = { workspace = true }
